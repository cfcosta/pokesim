name: Project integrity

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Check pristine imported source
        run: python3 tools/check-pokered-source.py
      - name: Rebuild canonical Red and exercise the battle ROM fixture
        run: |
          rom="$(mktemp --suffix=.gbc)"
          trap 'rm -f "$rom"' EXIT
          nix develop -c python3 tools/check-pokered-build.py --rebuild --jobs 4 --output-rom "$rom"
          python3 tools/generate-pokered-reachability.py --rom "$rom"
          python3 tools/generate-pokered-min-levels.py --rom "$rom" \
            --check docs/reference/pokemon-red-minimum-levels.md \
            --check-lean packages/battle-lean/Battle/Data/MinimumLevels.lean
          nix develop -c lake -d packages/battle-lean exe battleRomFixture "$rom"
      - name: Build battle and DMG-CPU B adapter proofs
        run: nix develop -c lake -d packages/battle-lean build Battle Battle.GameBoy Battle.Rom Battle.DriverInvariant
      - name: Run restricted model-against-itself smoke matrix
        run: nix develop -c lake -d packages/battle-lean exe battleSelfPlay
      - name: Run full-party model-against-itself smoke matrix
        run: nix develop -c lake -d packages/battle-lean exe battleFullSelfPlay
      - name: Check canonical address/range closure
        run: python3 tools/check-pokered-closure.py
      - name: Check documentation against nested source
        run: python3 tools/validate-docs.py
      - name: Compile Python tooling
        run: python3 -m py_compile tools/*.py
