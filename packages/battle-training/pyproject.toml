[project]
name = "battle-training"
version = "0.1.0"
description = "External actor-learner for the verified Pokémon Red battle model"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.0",
    "torch>=2.7",
]

[project.scripts]
battle-train = "battle_training.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["battle_training"]

[tool.uv]
required-version = ">=0.8"
