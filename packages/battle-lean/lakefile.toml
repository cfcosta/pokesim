name = "battle-lean"
version = "0.1.0"
defaultTargets = ["Battle", "battleFixtures"]
testDriver = "battleFixtures"

# The verified SM83 core is the L0 oracle the differential harness drives.
[[require]]
name = "sm83-lean"
path = "../sm83-lean"

[[lean_lib]]
name = "Battle"

# The Stage-0 end-to-end fixture matrix, runnable as `lake test`.
[[lean_exe]]
name = "battleFixtures"
root = "Battle.FixturesMain"

# Consumes a caller-supplied, hash-checked temporary canonical ROM.
[[lean_exe]]
name = "battleRomFixture"
root = "Battle.Rom.FixtureMain"
