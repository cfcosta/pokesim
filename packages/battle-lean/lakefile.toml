name = "battle-lean"
version = "0.1.0"
defaultTargets = ["Battle", "battleFixtures"]
testDriver = "battleFixtures"

# The verified SM83 core is the L0 oracle the differential harness drives.
[[require]]
name = "sm83-lean"
path = "../sm83-lean"

[[lean_lib]]
name = "Battle"

# The Stage-0 end-to-end fixture matrix, runnable as `lake test`.
[[lean_exe]]
name = "battleFixtures"
root = "Battle.FixturesMain"

# Consumes a caller-supplied, hash-checked temporary canonical ROM.
[[lean_exe]]
name = "battleRomFixture"
root = "Battle.Rom.FixtureMain"

# Native model-against-itself smoke runner for the restricted ordinary profile.
[[lean_exe]]
name = "battleSelfPlay"
root = "Battle.RL.SelfPlayMain"

# Full-party, all-effect model-against-itself smoke runner.
[[lean_exe]]
name = "battleFullSelfPlay"
root = "Battle.Full.SelfPlayMain"

# Emit two progression-witnessed teams in Pokémon Showdown import format.
[[lean_exe]]
name = "battleGenerateTeams"
root = "Battle.RL.TeamGeneratorMain"

# Run one generated match and emit Pokémon Showdown simulator protocol.
[[lean_exe]]
name = "battleSelfPlayLog"
root = "Battle.Full.SelfPlayLogMain"
