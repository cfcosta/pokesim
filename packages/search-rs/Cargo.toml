[package]
name = "battle-search"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Batched simultaneous matrix-tree orchestration with Python search parity"

[dependencies]
base64 = "0.22"
libc = "0.2"
pyo3 = { version = "0.29.0", features = ["abi3-py312"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
extension-module = ["pyo3/extension-module"]

[lib]
name = "battle_search"
crate-type = ["cdylib", "rlib"]

[profile.release]
lto = "fat"
codegen-units = 1
